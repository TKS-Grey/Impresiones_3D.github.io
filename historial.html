<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Makers - Historial</title>

    <link rel="stylesheet" href="historial.css">

    <script type="module" src="historial.js" defer></script>
</head>

<body>

    <header>

        <a href="https://impresiones-3d-aml.web.app/" class="volver">
            Volver al inicio
        </a>

        <h1>The Makers Historial</h1>

        <button id="btnModoOscuro" class="btn-modo">
            Modo Oscuro
        </button>

    </header>


    <main>

        <section class="usuario">

            <h2>Mi cuenta</h2>

            <p id="usuarioNombre"></p>

            <p id="usuarioCorreo"></p>

        </section>


        <section id="panelAdmin" class="admin-panel">

            <h2>Administración de entregas</h2>
            <form id="formEntrega">
                <div class="campo">
                    <label for="usuarioEntrega">
                        Usuario
                    </label>
                    <select id="usuarioEntrega" required>
                        <option value="">
                            Selecciona un usuario
                        </option>
                    </select>
                </div>
                <div class="campo">
                    <label for="pedidoEntrega">
                        Pedido
                    </label>

                    <select id="pedidoEntrega" required>
                        <option value="">
                            Selecciona un pedido
                        </option>
                    </select>
                </div>

                <div class="campo campo-completo">
                    <label for="fotoEntrega">
                        Foto del usuario junto a su pedido
                    </label>

                    <input
                        type="file"
                        id="fotoEntrega"
                        accept="image/*"
                        required>
                </div>

                <div class="campo">
                    <label for="fechaEntrega">
                        Fecha de entrega
                    </label>

                    <input
                        type="date"
                        id="fechaEntrega"
                        required>
                </div>


                <div class="campo">
                    <label for="horaEntrega">
                        Hora de entrega
                    </label>

                    <input
                        type="time"
                        id="horaEntrega"
                        required>
                </div>


                <button type="submit" class="btn-agregar">
                    Agregar entrega
                </button>
                </form>
            <p id="mensajeAdmin"></p>

        </section>
        <section class="historial">

            <h2>Mis entregas</h2>

            <p id="mensajeHistorial" class="mensaje-historial"></p>

            <div id="entregas" class="entregas"></div>

        </section>

    </main>


    <footer>

        <p>
            The Makers - Historial de entregas
        </p>

    </footer>

</body>

</html>
